[build]
  command = "npm run build"
  publish = "dist"

# Single-page app fallback: unknown paths serve index.html (real files win first)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed assets never change, so cache them for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
